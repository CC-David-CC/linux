[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webos-linux-guest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["webos-accounts==0.1.0", "aiohttp==3.14.5", "cryptography==46.0.7"]

[tool.setuptools]
packages = ["guest_service"]

[tool.setuptools.package-dir]
guest_service = "server/guest_service"
